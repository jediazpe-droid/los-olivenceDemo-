<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Día · Prioridades</title>
  <style>
    :root { --azul: #1e6fd9; --azul-oscuro: #1858b0; --texto: #1f2d3d; --suave: #55657a; --fondo: #f7fafc; --borde: #d5dde6; --clase: #1e6fd9; --trabajo: #51607a; --libre: #d6f1e0; --urgente: #b42318; }
    * { box-sizing: border-box; }
    body { font-family: Calibri, Arial, sans-serif; margin: 0; background: var(--fondo); color: var(--texto); padding: 24px 16px 120px; }
    main { max-width: 520px; margin: 0 auto; display: grid; gap: 20px; }
    .fecha { margin: 0; color: var(--suave); text-transform: capitalize; }
    h1 { color: #051c2c; font-size: 1.8rem; margin: 4px 0 0; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; color: #051c2c; }
    section, details { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 20px; }
    .resumen { margin: 0 0 14px; font-size: 1.05rem; font-weight: bold; }
    .barra { position: relative; height: 36px; background: var(--libre); border-radius: 8px; overflow: hidden; }
    .bloque { position: absolute; top: 0; bottom: 0; }
    .bloque.clase { background: var(--clase); }
    .bloque.trabajo { background: var(--trabajo); }
    .marcador { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #051c2c; }
    .escala { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--suave); margin-top: 4px; }
    .leyenda { display: flex; gap: 14px; font-size: 0.85rem; color: var(--suave); margin: 10px 0 0; flex-wrap: wrap; }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    .sw.clase { background: var(--clase); }
    .sw.trabajo { background: var(--trabajo); }
    .sw.libre { background: var(--libre); }
    .huecos { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; font-size: 0.95rem; }
    ul.lista { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .tarjeta { border: 1px solid var(--borde); border-left: 4px solid var(--azul); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
    .tarjeta.urgente { border-left-color: var(--urgente); }
    .cuando { font-size: 0.85rem; font-weight: bold; color: var(--azul); }
    .tarjeta.urgente .cuando { color: var(--urgente); }
    .tarjeta small { color: var(--suave); }
    .vacio, .mas { color: var(--suave); margin: 8px 0 0; font-size: 0.95rem; }
    .mas:empty, .vacio[hidden] { display: none; }
    summary { cursor: pointer; font-weight: bold; color: #051c2c; }
    .editor { display: grid; gap: 12px; margin-top: 16px; }
    .editor label { display: grid; gap: 4px; font-size: 0.9rem; font-weight: bold; }
    .fila-jornada { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .fila-clase { display: grid; grid-template-columns: 1.6fr 1fr 1fr auto; gap: 8px; align-items: end; }
    input { font: inherit; font-weight: normal; padding: 8px 10px; border: 1px solid var(--borde); border-radius: 8px; width: 100%; min-width: 0; }
    .quitar { background: #fff; color: var(--urgente); border: 1px solid var(--borde); border-radius: 8px; padding: 8px 12px; font-size: 1rem; cursor: pointer; }
    .acciones { display: flex; gap: 10px; flex-wrap: wrap; }
    .boton { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--azul); background: #fff; color: var(--azul); cursor: pointer; }
    .boton.principal { background: var(--azul); color: #fff; }
    .boton.principal:hover { background: var(--azul-oscuro); }
    .error { color: var(--urgente); font-size: 0.9rem; margin: 0; min-height: 1em; }
    .hecho { justify-self: start; margin-top: 6px; font-size: 0.9rem; padding: 8px 12px; color: var(--exito); border-color: var(--exito); }
    .enlace-nav { color: var(--azul); text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .boton-mas { position: fixed; right: 24px; bottom: 24px; width: 64px; height: 64px; border-radius: 50%; background: var(--azul); color: #fff; font-size: 2.2rem; line-height: 64px; text-align: center; text-decoration: none; box-shadow: 0 6px 16px rgba(5, 28, 44, 0.25); }
    .boton-mas:hover { background: var(--azul-oscuro); }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="fecha" id="fecha"></p>
      <h1 id="saludo"></h1>
      <a class="enlace-nav" href="/progreso.html">Mi progreso →</a>
    </header>

    <section aria-labelledby="titulo-carga">
      <h2 id="titulo-carga">Carga del día</h2>
      <p class="resumen" id="resumen"></p>
      <div class="barra" id="barra" role="img" aria-label="Línea de tiempo del día con clases, trabajo y horas libres">
        <div class="marcador" id="marcador" hidden></div>
      </div>
      <div class="escala"><span>06:00</span><span>23:00</span></div>
      <div class="leyenda">
        <span><span class="sw clase"></span>Clases</span>
        <span><span class="sw trabajo"></span>Trabajo</span>
        <span><span class="sw libre"></span>Libre</span>
      </div>
      <ul class="huecos" id="huecos"></ul>
    </section>

    <section aria-labelledby="titulo-entregables">
      <h2 id="titulo-entregables">Entregables prioritarios</h2>
      <ul class="lista" id="entregables"></ul>
      <p class="vacio" id="sin-entregables">No tienes entregas en los próximos 7 días.</p>
      <p class="mas" id="mas"></p>
    </section>

    <details id="panel-horario">
      <summary>Configurar mi horario</summary>
      <div class="editor">
        <div class="fila-jornada">
          <label>Jornada laboral: inicio
            <input type="time" id="jornada-inicio">
          </label>
          <label>Jornada laboral: fin
            <input type="time" id="jornada-fin">
          </label>
        </div>
        <div id="filas-clases" style="display: grid; gap: 8px;"></div>
        <div class="acciones">
          <button type="button" class="boton" id="anadir-clase">+ Añadir clase</button>
          <button type="button" class="boton principal" id="guardar-horario">Guardar horario</button>
        </div>
        <p class="error" id="error-horario" role="alert"></p>
      </div>
    </details>
  </main>

  <a class="boton-mas" href="/registro.html" aria-label="Registrar trabajo o avance">+</a>

  <script>
    const CLAVE_PENDIENTES = 'pendientes';
    const CLAVE_HORARIO = 'horario';
    const NOMBRE = 'Angelina';
    const INICIO_DIA = 6 * 60;
    const FIN_DIA = 23 * 60;
    const DIA_MS = 24 * 60 * 60 * 1000;

    const pad = n => String(n).padStart(2, '0');
    const aMinutos = hhmm => {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    };
    const aHHMM = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
    const posicion = min => `${((min - INICIO_DIA) / (FIN_DIA - INICIO_DIA)) * 100}%`;
    const anchura = min => `${(min / (FIN_DIA - INICIO_DIA)) * 100}%`;
    const duracion = min => {
      const h = Math.floor(min / 60);
      const m = min % 60;
      if (h && m) return `${h} h ${m} min`;
      if (h) return `${h} h`;
      return `${m} min`;
    };
    const mismoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

    function leerJSON(clave, respaldo) {
      try {
        return JSON.parse(localStorage.getItem(clave)) ?? respaldo;
      } catch {
        return respaldo;
      }
    }

    let horario = leerJSON(CLAVE_HORARIO, { jornada: null, clases: [] });

    function bloquesOcupados() {
      const bloques = horario.clases.map(c => ({ inicio: aMinutos(c.inicio), fin: aMinutos(c.fin), nombre: c.nombre, tipo: 'clase' }));
      if (horario.jornada) {
        bloques.push({ inicio: aMinutos(horario.jornada.inicio), fin: aMinutos(horario.jornada.fin), nombre: 'Jornada laboral', tipo: 'trabajo' });
      }
      return bloques
        .map(b => ({ ...b, inicio: Math.max(b.inicio, INICIO_DIA), fin: Math.min(b.fin, FIN_DIA) }))
        .filter(b => b.fin > b.inicio)
        .sort((a, b) => a.inicio - b.inicio);
    }

    function huecosLibres(ocupados) {
      const libres = [];
      let cursor = INICIO_DIA;
      for (const b of ocupados) {
        if (b.inicio > cursor) libres.push({ inicio: cursor, fin: b.inicio });
        cursor = Math.max(cursor, b.fin);
      }
      if (cursor < FIN_DIA) libres.push({ inicio: cursor, fin: FIN_DIA });
      return libres;
    }

    function renderCarga() {
      const ahora = new Date();
      const ahoraMin = ahora.getHours() * 60 + ahora.getMinutes();
      const ocupados = bloquesOcupados();
      const libres = huecosLibres(ocupados);
      const libreMin = libres.reduce((t, h) => t + Math.max(0, h.fin - Math.max(h.inicio, ahoraMin)), 0);
      const sinHorario = !horario.jornada && horario.clases.length === 0;

      const resumen = document.getElementById('resumen');
      if (sinHorario) resumen.textContent = 'Configura tu horario para ver tus horas libres.';
      else if (libreMin === 0) resumen.textContent = 'Hoy no te quedan horas libres.';
      else resumen.textContent = `Te quedan ${duracion(libreMin)} libres hoy.`;

      const barra = document.getElementById('barra');
      const marcador = document.getElementById('marcador');
      barra.replaceChildren(marcador, ...ocupados.map(b => {
        const div = document.createElement('div');
        div.className = `bloque ${b.tipo}`;
        div.style.left = posicion(b.inicio);
        div.style.width = anchura(b.fin - b.inicio);
        div.title = `${b.nombre} ${aHHMM(b.inicio)}–${aHHMM(b.fin)}`;
        return div;
      }));
      marcador.hidden = ahoraMin < INICIO_DIA || ahoraMin > FIN_DIA;
      marcador.style.left = posicion(ahoraMin);

      const huecos = document.getElementById('huecos');
      huecos.replaceChildren(...libres
        .map(h => ({ inicio: Math.max(h.inicio, ahoraMin), fin: h.fin }))
        .filter(h => h.fin > h.inicio)
        .map(h => {
          const li = document.createElement('li');
          li.textContent = `Libre ${aHHMM(h.inicio)} – ${aHHMM(h.fin)} · ${duracion(h.fin - h.inicio)}`;
          return li;
        }));
    }

    function etiquetaFecha(fecha, ahora) {
      const hora = fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
      const manana = new Date(ahora);
      manana.setDate(ahora.getDate() + 1);
      if (mismoDia(fecha, ahora)) return `Hoy ${hora}`;
      if (mismoDia(fecha, manana)) return `Mañana ${hora}`;
      return fecha.toLocaleString('es-ES', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function tarjetaEntrega(p, ahora) {
      const fecha = new Date(p.entrega);
      const li = document.createElement('li');
      li.className = 'tarjeta' + (fecha - ahora < DIA_MS ? ' urgente' : '');

      const cuando = document.createElement('span');
      cuando.className = 'cuando';
      cuando.textContent = etiquetaFecha(fecha, ahora);

      const titulo = document.createElement('strong');
      titulo.textContent = `${p.curso}: ${p.titulo}`;

      const detalle = document.createElement('small');
      detalle.textContent = `Bloque sugerido: ${p.sugerencia}`;

      const hecho = document.createElement('button');
      hecho.type = 'button';
      hecho.className = 'boton hecho';
      hecho.textContent = 'Marcar como hecho';
      hecho.addEventListener('click', () => marcarHecho(p.id));

      li.append(cuando, titulo, detalle, hecho);
      return li;
    }

    function marcarHecho(id) {
      const pendientes = leerJSON(CLAVE_PENDIENTES, []).map(p => (
        p.id === id ? { ...p, completado: true, completadoEn: new Date().toISOString() } : p
      ));
      localStorage.setItem(CLAVE_PENDIENTES, JSON.stringify(pendientes));
      renderEntregables();
    }

    function renderEntregables() {
      const ahora = new Date();
      const limite = ahora.getTime() + 7 * DIA_MS;
      const proximos = leerJSON(CLAVE_PENDIENTES, [])
        .filter(p => {
          if (p.completado) return false;
          const t = new Date(p.entrega).getTime();
          return t >= ahora.getTime() && t <= limite;
        })
        .sort((a, b) => new Date(a.entrega) - new Date(b.entrega));

      document.getElementById('entregables').replaceChildren(...proximos.slice(0, 5).map(p => tarjetaEntrega(p, ahora)));
      document.getElementById('sin-entregables').hidden = proximos.length > 0;
      document.getElementById('mas').textContent = proximos.length > 5 ? `Y ${proximos.length - 5} más en los próximos 7 días.` : '';
    }

    function filaClase(clase = { nombre: '', inicio: '', fin: '' }) {
      const fila = document.createElement('div');
      fila.className = 'fila-clase';

      const nombre = document.createElement('input');
      nombre.type = 'text';
      nombre.placeholder = 'Materia';
      nombre.value = clase.nombre;
      nombre.setAttribute('aria-label', 'Nombre de la clase');

      const inicio = document.createElement('input');
      inicio.type = 'time';
      inicio.value = clase.inicio;
      inicio.setAttribute('aria-label', 'Hora de inicio de la clase');

      const fin = document.createElement('input');
      fin.type = 'time';
      fin.value = clase.fin;
      fin.setAttribute('aria-label', 'Hora de fin de la clase');

      const quitar = document.createElement('button');
      quitar.type = 'button';
      quitar.className = 'quitar';
      quitar.textContent = '×';
      quitar.setAttribute('aria-label', 'Quitar clase');
      quitar.addEventListener('click', () => fila.remove());

      fila.append(nombre, inicio, fin, quitar);
      return fila;
    }

    function cargarEditor() {
      document.getElementById('jornada-inicio').value = horario.jornada?.inicio ?? '';
      document.getElementById('jornada-fin').value = horario.jornada?.fin ?? '';
      const filas = document.getElementById('filas-clases');
      filas.replaceChildren(...horario.clases.map(c => filaClase(c)));
    }

    function guardarHorario() {
      const error = document.getElementById('error-horario');
      error.textContent = '';
      const inicioJornada = document.getElementById('jornada-inicio').value;
      const finJornada = document.getElementById('jornada-fin').value;
      const jornadaCompleta = inicioJornada && finJornada;
      if (jornadaCompleta && aMinutos(finJornada) <= aMinutos(inicioJornada)) {
        error.textContent = 'La jornada debe terminar después de empezar.';
        return;
      }

      const clases = [];
      for (const fila of document.querySelectorAll('#filas-clases .fila-clase')) {
        const [nombre, inicio, fin] = fila.querySelectorAll('input');
        if (!inicio.value || !fin.value || aMinutos(fin.value) <= aMinutos(inicio.value)) {
          error.textContent = 'Revisa las clases: cada una necesita hora de inicio y fin válidas.';
          return;
        }
        clases.push({ nombre: nombre.value.trim() || 'Clase', inicio: inicio.value, fin: fin.value });
      }

      horario = {
        jornada: jornadaCompleta ? { inicio: inicioJornada, fin: finJornada } : null,
        clases
      };
      localStorage.setItem(CLAVE_HORARIO, JSON.stringify(horario));
      document.getElementById('panel-horario').open = false;
      renderCarga();
    }

    function iniciar() {
      const ahora = new Date();
      document.getElementById('fecha').textContent = ahora.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('saludo').textContent = `Hola, ${NOMBRE}`;

      cargarEditor();
      document.getElementById('anadir-clase').addEventListener('click', () => {
        document.getElementById('filas-clases').append(filaClase());
      });
      document.getElementById('guardar-horario').addEventListener('click', guardarHorario);

      renderCarga();
      renderEntregables();
      setInterval(() => {
        renderCarga();
        renderEntregables();
      }, 60 * 1000);
    }

    iniciar();
  </script>
</body>
</html>
