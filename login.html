<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenido · César Vallejo</title>
  <style>
    :root { --azul: #1e6fd9; --azul-oscuro: #1858b0; --texto: #1f2d3d; --suave: #55657a; --fondo: #f7fafc; --borde: #d5dde6; --urgente: #b42318; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { font-family: Calibri, Arial, sans-serif; margin: 0; background: var(--fondo); color: var(--texto); min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    main { width: 100%; max-width: 380px; display: grid; gap: 20px; }
    h1 { color: #051c2c; font-size: 1.6rem; margin: 0; text-align: center; }
    .sub { margin: -8px 0 0; color: var(--suave); text-align: center; }
    form, .bienvenida { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 24px; display: grid; gap: 16px; }
    .bienvenida p { margin: 0; line-height: 1.5; }
    label { display: grid; gap: 6px; font-weight: bold; font-size: 0.95rem; }
    input { font: inherit; font-weight: normal; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; }
    input:focus { outline: 2px solid var(--azul); border-color: transparent; }
    button { font: inherit; font-size: 1.05rem; padding: 12px; color: #fff; background: var(--azul); border: 1px solid var(--azul); border-radius: 8px; cursor: pointer; }
    button:hover { background: var(--azul-oscuro); }
    button.secundario { background: #fff; color: var(--azul); }
    button.secundario:hover { background: #eef5ff; }
    .error { color: var(--urgente); font-size: 0.9rem; margin: 0; min-height: 1em; }
  </style>
</head>
<body>
  <main>
    <h1>Bienvenido a la César Vallejo</h1>

    <form id="formulario" novalidate>
      <p class="sub" style="margin: 0;">Inicia sesión para continuar</p>
      <label>Usuario
        <input name="usuario" autocomplete="username">
      </label>
      <label>Contraseña
        <input name="contrasena" type="password" autocomplete="current-password">
      </label>
      <p class="error" id="error" role="alert"></p>
      <button type="submit">Ingresar</button>
    </form>

    <section class="bienvenida" id="bienvenida" hidden>
      <p id="saludo"></p>
      <p>Te damos la bienvenida a tu espacio de estudio.</p>
      <button type="button" class="secundario" id="salir">Cerrar sesión</button>
    </section>
  </main>

  <script>
    const USUARIO_VALIDO = 'estudiante';
    const CONTRASENA_VALIDA = 'ucv2026';
    const CLAVE_SESION = 'sesion_ucv';

    const formulario = document.getElementById('formulario');
    const errorEl = document.getElementById('error');
    const bienvenida = document.getElementById('bienvenida');

    function mostrar(autenticado, usuario = '') {
      formulario.hidden = autenticado;
      bienvenida.hidden = !autenticado;
      document.getElementById('saludo').textContent = `Has ingresado como ${usuario}.`;
    }

    formulario.addEventListener('submit', event => {
      event.preventDefault();
      errorEl.textContent = '';
      const usuario = formulario.elements.usuario.value.trim();
      const contrasena = formulario.elements.contrasena.value;

      if (!usuario || !contrasena) {
        errorEl.textContent = 'Escribe tu usuario y tu contraseña.';
        return;
      }
      if (usuario !== USUARIO_VALIDO || contrasena !== CONTRASENA_VALIDA) {
        errorEl.textContent = 'Usuario o contraseña incorrectos.';
        formulario.elements.contrasena.value = '';
        return;
      }

      sessionStorage.setItem(CLAVE_SESION, usuario);
      formulario.reset();
      mostrar(true, usuario);
    });

    document.getElementById('salir').addEventListener('click', () => {
      sessionStorage.removeItem(CLAVE_SESION);
      mostrar(false);
    });

    const sesion = sessionStorage.getItem(CLAVE_SESION);
    mostrar(Boolean(sesion), sesion ?? '');
  </script>
</body>
</html>
